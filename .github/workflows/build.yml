name: Build installers

# Builds the Windows (NSIS .exe) and macOS (.dmg) installers, each with its
# bundled OCR runtime, and runs the end-to-end queue tests against that runtime
# on the real OS. Push a tag like v0.2.0 to attach the installers to a release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime-script: scripts/bundle-runtime-windows.ps1
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-15 # Apple Silicon
            runtime-script: scripts/bundle-runtime-macos.sh
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      TESS_LANGS: eng osd
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v6

      # The runtime only changes when its build script (or language list) does.
      - name: Cache OCR runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(matrix.runtime-script) }}-${{ env.TESS_LANGS }}

      - name: Build OCR runtime (Windows)
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/bundle-runtime-windows.ps1

      - name: Build OCR runtime (macOS)
        if: runner.os == 'macOS' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          brew install tesseract pngquant dylibbundler
          ./scripts/bundle-runtime-macos.sh

      - name: Verify cached runtime (Windows)
        if: runner.os == 'Windows' && steps.runtime-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: ./scripts/verify-runtime-windows.ps1

      - run: pnpm install --frozen-lockfile

      - name: Tests (unit + end-to-end queue tests on the bundled runtime)
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        env:
          CI: "true"
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
